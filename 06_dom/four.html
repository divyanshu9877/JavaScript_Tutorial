<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom | Chai aur code</title>
</head>
<body style="background-color: #0f0c0c; color: white"
>
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`             // try to avoid innerHTML
        document.querySelector('.language').appendChild(li);
    }
    addLanguage("python")
    addLanguage("typescript")

    function addOptiLanguage(language){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(language))  // use append child this is better approaches
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('golang')


    // Edit 
    const secondLang = document.querySelector("li:nth-child(2)")
    console.log(secondLang);
    // secondLang.innerHTML = "mojo"     // this is not good approach
    const newli = document.createElement('li')
    newli.textContent = "mojo"
    secondLang.replaceWith(newli)

    // edit
    const firstLang = document.querySelector("li:first-child")
    firstlang.outerHTML = '<li>Typescript</li>'

    //remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()
</script>
</html>
